name: Keep Render warm

# Render's free tier spins the service down after ~15 min without traffic;
# the next visitor then pays a 30-50s cold start. Pinging the app every 10
# minutes keeps one instance resident (~720 hrs/month, inside the 750 hr
# free allowance for a single service).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the dashboard
        run: |
          # `run:` blocks execute under `bash -e`, so a non-zero curl (e.g. 28,
          # timeout, which happens whenever Render is mid-redeploy) aborts the
          # step before the `exit 0` below is ever reached. Swallow it here.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            https://wind-forecast-dashboard.onrender.com/ || echo "000")
          echo "HTTP $code"
          # 2xx/3xx = warm; anything else still counts as a wake-up attempt
          exit 0
