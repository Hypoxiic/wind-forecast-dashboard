name: Nightly forecast update

on:
  schedule:
    - cron: '30 1 * * *'        # 01:30 UTC every day
  workflow_dispatch:            # lets you trigger it by hand

# Never let two runs race each other on git push
concurrency:
  group: nightly-forecast
  cancel-in-progress: false

jobs:
  build-run:
    runs-on: ubuntu-latest
    # Add permissions block to grant write access for GITHUB_TOKEN
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y libgomp1   # CatBoost needs OpenMP

      - name: Run nightly pipeline
        run: |
          # launch the package as a module so "src" is on PYTHONPATH
          python -m src.pipeline

      - name: Commit & push updated data
        id: commit
        run: |
          git config user.name  "Wind-Bot"
          git config user.email "actions@github.com"
          # Stage every tracked file the pipeline rewrites, so the repo
          # stays consistent with the inputs that produced each prediction.
          git add data/predictions/latest.parquet
          git add data/features/history.parquet
          git add data/features/for_predict.parquet
          git add data/raw/ci.parquet data/raw/openmeteo_weather.parquet

          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            ts=$(date -u +'%Y-%m-%d')
            git commit -m "Nightly forecast update: $ts"
            git pull --rebase origin main
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger cloud deployment
        # Set RENDER_DEPLOY_HOOK_URL in repo Settings → Secrets and variables
        # → Actions. Rotate the hook on Render first; the previous URL was
        # committed in plaintext and is permanently exposed in git history.
        # Only fires when data was actually pushed - a no-op night must not
        # burn a Render build/cold-start. The secret check runs in the shell
        # because step-level `if:` cannot reliably see the same step's env.
        if: steps.commit.outputs.pushed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy trigger."
            exit 0
          fi
          curl -X POST -fsS "$RENDER_DEPLOY_HOOK_URL"
