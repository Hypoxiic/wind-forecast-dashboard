# Run `pre-commit install` once after pulling. Ruff and black both pick up
# their settings from pyproject.toml; this file just wires the hooks in.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Skip the committed parquets / model artefacts which legitimately
        # live in this repo until item 20 of the improvement plan moves
        # them to LFS.
        exclude: ^(data/|models/|catboost_info/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
